<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #root { position: absolute; top: 0; left: 0; transform-origin: top left; }
  input::placeholder { color: var(--faint); }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<script>
  // scale the fixed 1560×940 hub to fit any viewport (letterboxed on black)
  function fitHub() {
    var W = 1560, H = 940;
    var vw = window.innerWidth, vh = window.innerHeight;
    if (!vw || !vh) return;                       // skip while the frame has no size
    var s = Math.min(vw / W, vh / H);
    if (!(s > 0)) return;
    var x = (vw - W * s) / 2, y = (vh - H * s) / 2;
    var root = document.getElementById('root');
    root.style.width = W + 'px';
    root.style.height = H + 'px';
    root.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fitHub);
  document.addEventListener('DOMContentLoaded', fitHub);
  if (window.ResizeObserver) { new ResizeObserver(fitHub).observe(document.documentElement); }
  [0, 60, 200, 500, 1000].forEach(function (d) { setTimeout(fitHub, d); });
</script>
